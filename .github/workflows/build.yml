name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# SHA-256 of the release signing certificate. Every published APK is checked against it.
env:
  CERT_SHA256: 32af720229f1e6c1adb71154c5fc2deb5bef1c41c331636e7d09dc411cb4c117

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits so a moved tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.11.1

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCRYWALL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The SCRYWALL_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scrywall-release.jks"

      - name: Build APK
        env:
          SCRYWALL_KEYSTORE: ${{ runner.temp }}/scrywall-release.jks
          SCRYWALL_KEYSTORE_PASSWORD: ${{ secrets.SCRYWALL_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/scrywall-release.jks"

      - name: Verify signature and checksum
        id: verify
        run: |
          cp app/build/outputs/apk/release/app-release.apk ScryWall.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --print-certs ScryWall.apk)"
          echo "$certs"
          if ! echo "$certs" | grep -qi "certificate SHA-256 digest: $CERT_SHA256"; then
            echo "::error::ScryWall.apk is not signed with the expected release key."
            exit 1
          fi
          echo "apk_sha256=$(sha256sum ScryWall.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScryWall-apk
          path: ScryWall.apk

      # Publishes the APK as a GitHub Release so it can be downloaded
      # straight to a phone from the repo's Releases page.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScryWall build ${{ github.run_number }}
          files: ScryWall.apk
          make_latest: true
          body: |
            Built from ${{ github.sha }}.

            **ScryWall.apk SHA-256:** `${{ steps.verify.outputs.apk_sha256 }}`
            **Signing certificate SHA-256:** `${{ env.CERT_SHA256 }}`
