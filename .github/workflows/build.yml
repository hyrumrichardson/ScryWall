name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScryWall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScryWall-apk
          path: ScryWall.apk

      # Publishes the APK as a GitHub Release so it can be downloaded
      # straight to a phone from the repo's Releases page.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScryWall build ${{ github.run_number }}
          files: ScryWall.apk
          make_latest: true
